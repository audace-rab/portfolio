<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="300" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#8b5cf6" opacity="0.1"/>
  
  <!-- Accent line -->
  <rect x="80" y="200" width="80" height="4" fill="url(#accent)" rx="2"/>
  
  <!-- Name -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="white">Audace Rabarison</text>
  
  <!-- Title -->
  <text x="80" y="340" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="url(#text-gradient)">Software Engineer</text>
  
  <!-- Description -->
  <text x="80" y="400" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#94a3b8">Développeur web et applications métier</text>
  
  <!-- Tech stack -->
  <text x="80" y="480" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#64748b">C# · .NET · React · Angular · Vue.js · Oracle</text>
  
  <!-- Footer accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
  
  <!-- Portfolio badge -->
  <rect x="80" y="520" width="200" height="40" fill="url(#accent)" rx="20"/>
  <text x="180" y="546" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">PORTFOLIO</text>
</svg>