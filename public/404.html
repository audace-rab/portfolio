<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex" />
    <title>404 — Page introuvable | Audace Rabarison</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #1e293b 0%, #0f172a 45%, #020617 100%);
        color: #e2e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .wrap { max-width: 28rem; width: 100%; animation: fadeUp 0.6s ease both; }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 1.5rem;
        display: flex; align-items: center; justify-content: center;
        border-radius: 9999px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        font-weight: 700; font-size: 1.25rem; color: #fff;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
      }
      .code {
        font-size: clamp(5rem, 20vw, 7rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: block;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.5rem; color: #fff; }
      p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
      a.btn {
        display: inline-block;
        padding: 0.8rem 1.75rem;
        border-radius: 9999px;
        background: linear-gradient(90deg, #f59e0b, #d97706);
        color: #fff; font-weight: 600; text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a.btn:hover, a.btn:focus-visible { opacity: 0.88; }
      a.btn:focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
      .fr, .en { display: none; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wrap { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="logo" aria-hidden="true">AR</div>
      <span class="code">404</span>
      <h1 class="fr">Page introuvable</h1>
      <h1 class="en">Page not found</h1>
      <p class="fr">Oups ! La page que vous cherchez n'existe pas ou a été déplacée.</p>
      <p class="en">Oops! The page you are looking for does not exist or has been moved.</p>
      <a class="btn" href="/portfolio/">Retour à l'accueil · Back home</a>
    </main>
    <script>
      ;(function () {
        var lang = (navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'
        document.documentElement.lang = lang
        ;[].forEach.call(document.querySelectorAll('.' + lang), function (el) {
          el.style.display = 'block'
        })
      })()
    </script>
  </body>
</html>
